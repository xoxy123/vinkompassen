<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Vinonests märke: sju flasködar i ett ställ, sedda rakt på.
    Formen bor i scripts/make-icons.py och speglas i
    src/components/Mark.tsx. Ändra aldrig bara den ena.
  -->
  <defs>
    <linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="205" y2="512">
      <stop offset="0%" stop-color="#7d1c26"/>
      <stop offset="52%" stop-color="#3d0e19"/>
      <stop offset="100%" stop-color="#140407"/>
    </linearGradient>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="420" cy="61" r="282">
      <stop offset="0%" stop-color="#c9713a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9713a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="130" y1="120" x2="350" y2="410">
      <stop offset="0%" stop-color="#f9e9c4"/>
      <stop offset="50%" stop-color="#eccb8c"/>
      <stop offset="100%" stop-color="#c08f4a"/>
    </linearGradient>
    <!-- Vinet är en radiell gradient med sitt ljusa öga uppe till vänster,
         inte en platt ton: alla sju ändarna ligger i samma ljus, och det är
         det som gör klungan till ett rum i stället för ett mönster. -->
    <radialGradient id="vin" gradientUnits="userSpaceOnUse" cx="216" cy="200" r="230">
      <stop offset="0%" stop-color="#a83a49"/>
      <stop offset="100%" stop-color="#4a1019"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>
  <rect width="512" height="512" fill="url(#ember)"/>

  <g transform="translate(256 256) scale(0.68) translate(-256 -256)">
    <circle cx="256.0" cy="256.0" r="58.0" fill="url(#vin)" stroke="url(#gold)" stroke-width="9.0"/>
