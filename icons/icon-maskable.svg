    <circle cx="189.5" cy="140.8" r="19.7" fill="none" stroke="url(#gold)" stroke-width="3.1" opacity="0.45"/>
    <path d="M140.0 126.6 A51.5 51.5 0 0 1 178.8 90.4" fill="none" stroke="#f9e9c4" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
