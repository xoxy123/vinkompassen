  <!--
    Vinonests märke: en graverad druvklase med vinlöv och ranka.
    Formen bor i scripts/make-icons.py och speglas i
    src/components/Mark.tsx. Ändra aldrig bara den ena.
  -->
  <defs>
    <linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="205" y2="512">
      <stop offset="0%" stop-color="#7d1c26"/>
      <stop offset="52%" stop-color="#3d0e19"/>
      <stop offset="100%" stop-color="#140407"/>
    </linearGradient>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="420" cy="61" r="282">
      <stop offset="0%" stop-color="#c9713a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9713a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="130" y1="100" x2="350" y2="440">
      <stop offset="0%" stop-color="#f9e9c4"/>
      <stop offset="50%" stop-color="#eccb8c"/>
      <stop offset="100%" stop-color="#c08f4a"/>
    </linearGradient>
    <!-- Druvorna ligger i ett gemensamt ljus: gradientens ljusa öga sitter
         uppe till vänster för hela klasen, inte per druva. Det är det som
         gör klasen till en kropp i stället för till staplade cirklar. -->
    <radialGradient id="v" gradientUnits="userSpaceOnUse" cx="206" cy="230" r="240">
      <stop offset="0%" stop-color="#b8404e"/>
      <stop offset="100%" stop-color="#4a1019"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>
  <rect width="512" height="512" fill="url(#ember)"/>

